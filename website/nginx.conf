server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    # --- compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # --- caching ------------------------------------------------------------
    # Hashed build assets never change in place.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /shots/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /og-cover.png {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* ^/(favicon\.svg|apple-touch-icon\.png|icon-(192|512)\.png|site\.webmanifest)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML must stay fresh: revalidate on every navigation.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- routes -------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
